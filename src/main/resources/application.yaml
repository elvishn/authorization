server:
  port: 8081

spring:
  r2dbc:
    url: r2dbc:h2:mem:///test?options=DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
logging:
  level:
    org.springframework.r2dbc: DEBUG  # Покажет логи инициализации скриптов
    io.r2dbc.h2: DEBUG